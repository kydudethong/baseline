# Fly.io. Any host that runs a container works the same way (Railway, Render,
# a VPS with docker compose); only this file is Fly-specific.
app = "baseline-court"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # Frames per second the ball detector actually runs at.
  #
  # SET EXPLICITLY rather than left to detect_ball.py's default, because the
  # default and .env.local disagreed (15 vs 60) and nobody could say which one
  # production was using without reading the script. On 24fps source footage
  # this computes to step 3 -- one frame in three.
  #
  # 8 rather than the old 60 (which computed to step 1, EVERY frame) because
  # the ball track no longer feeds rally detection or shot classification --
  # Gemini owns both. What is left is the overlay trail Gemini reads at ~1fps,
  # and eight points in a one-second trail show direction and speed plainly.
  BALL_FPS_CAP = "8"

  # How the coaching scan reads the overlay: ten frames a second, each frame
  # read at the cheap tier, and as much of the clip as will fit in ONE call.
  #
  # These three are the whole cost of an analysis and they are set here, in one
  # place, because they are a CHOICE rather than a finding. September 2026 the
  # choice was reversed: detail over cheapness became cheapness over detail,
  # because 15fps at high was running about $3.75 for a twenty-minute game and
  # nothing else in the system moves the number as far. 10fps at low is closer
  # to $0.63 -- six times less for the same video.
  #
  # MEDIUM IS NOT A MIDDLE GROUND. For video Gemini treats low and medium
  # identically (~70 tokens a frame); only high is different (~280). There is
  # no half-price detail setting to reach for, so do not set "medium" expecting
  # one -- it is the same bill and the same pixels as "low".
  #
  # BACK TO HIGH, and the reason the argument for low collapsed is worth
  # recording. Low was chosen on the basis that the ball -- a dozen pixels, and
  # the only thing the coarse tier genuinely loses -- would be paid for by a
  # ring drawn around it in the overlay. That ring never drew a pixel: it hung
  # off the ball-trail code, and ball tracking was removed from this pipeline
  # long before the ring was written. So the cheap tier was never being
  # compensated for anything; Gemini was finding the ball unaided the whole
  # time.
  #
  # High is about 3.8x the bill -- roughly $4.69 against $1.23 for a
  # twenty-minute game on 3.8-flash. That is the real trade, with no ring in
  # it. ANALYST_MEDIA_RESOLUTION=low goes back the other way in one line.
  ANALYST_FPS = "8"
  ANALYST_MEDIA_RESOLUTION = "high"
  # Raised from the 120s default so the CONTEXT WINDOW is the only thing that
  # splits a clip. At 10fps and HIGH resolution a second of video costs ~2,580
  # tokens, so one call holds about 230 seconds — under four minutes. This
  # 900s cap therefore does nothing at these settings: the window binds first,
  # and a twenty-minute game is several segments rather than one pass. That is
  # the hidden cost of high, alongside the money: more calls, and the segment
  # sampling cap (MAX_SEGMENTS) comes back into play past ~30 minutes.
  #
  # The cost: past about two minutes in a single call the model has been
  # measured losing track of the clock and reporting rallies past the end of
  # the clip. Those are dropped when the segments are merged and the run logs
  # that it happened, so the failure shows up as missing rallies rather than
  # invented ones. Set this to "120" to trade the continuity back for
  # timestamps that have never been caught drifting.
  ANALYST_MAX_SEGMENT_SECONDS = "900"

  # The overlay encoder, tuned for the thing that is hardest to see in it.
  #
  # A pickleball is about a dozen pixels across at match distance, and it is
  # the first thing both H.264 and the model's own frame resize throw away.
  # CRF 20 keeps the bits, the unsharp mask restores the edge the resize takes,
  # and the trail is how a still frame shows a swing as an arc.
  OVERLAY_CRF = "20"
  OVERLAY_SHARPEN = "0.6"
  OVERLAY_POSE_TRAIL = "0"

  # The most pose frames one run will pay for.
  #
  # Pose had never actually run on this box until the ultralytics-warning bug
  # was fixed: the parse threw, the pass returned nothing, and it did so
  # instantly. Now it does the real work -- and a 13.7-minute clip is 4,121
  # frames of CPU inference on a machine with no accelerator. Past this many,
  # the clip is sampled evenly end to end rather than read in full.
  # No cap. This pass used to be the SECOND model over these frames -- a
  # detector ran first, then pose ran again -- and the cap stopped that second
  # pass adding half an hour to a long clip. The separate detector is gone now
  # and pose returns the boxes too, so capping this would thin out tracking
  # rather than just skeletons. VISION_FPS is the lever for a heavy run.
  POSE_MAX_FRAMES = "0"

  # The overlay is rendered at 720p whatever the source is. 1080p buys nothing:
  # the coaching model resizes every frame it is given to roughly a 768px tile
  # before looking at it, and a person scrubbing is checking whether the boxes
  # sit on the players. 0 renders at the source resolution.
  OVERLAY_MAX_HEIGHT = "720"
  # Court and skeleton line weights, as multipliers. Thin on purpose: every
  # pixel of drawn line is a pixel not spent on the ball, and court markings
  # do not move and do not need finding. Raise either for a human reader.
  OVERLAY_COURT_WEIGHT = "1.0"
  OVERLAY_SKELETON_WEIGHT = "1.0"

[http_service]
  internal_port = 3000
  force_https = true
  # A run continues on the Node event loop AFTER its HTTP response has gone
  # back (see pipeline-v2.ts). Stopping the machine when traffic goes quiet
  # would kill runs in flight, so this one stays up.
  auto_stop_machines = false
  # Left ON. A stopped machine is woken by the next incoming request, which is
  # what makes `npm run sleep` safe to use: the site keeps working for anyone
  # who visits, they just pay a cold start on the first request. On an image
  # carrying torch and ffmpeg that is tens of seconds, not milliseconds.
  auto_start_machines = true
  # Zero, so a machine stopped by `npm run sleep` STAYS stopped. This setting
  # governs Fly's own autostop behaviour rather than manual stops, but leaving
  # it at 1 states an intent -- "always keep one up" -- that is the opposite of
  # what a project being tested a few hours a week wants.
  #
  # Set it back to 1 when there are real users, because then a cold start on
  # someone's first visit is a worse trade than the hosting bill.
  min_machines_running = 0
  # ONE machine, always. Fly creates a second for high availability unless you
  # stop it, and a second machine is wrong for this app: a run lives in one
  # process's memory, and the overlay and setup frames it writes land on that
  # machine's disk. With two, requests round-robin, so roughly half the time
  # the browser asks the machine that never rendered the video and gets a 404.
  # --ha=false is what stops that, but ONLY where it applies: creating the app,
  # and deploying an app that has been scaled to zero. A routine deploy of an
  # app already running one Machine does not add a second, so the flag is not
  # needed on every deploy — it was in the first instructions for this app
  # because the first deploy is exactly the case where it does apply.
  # `fly scale count 1` is the fix if a second one already exists.

# No volume on purpose. The two things written to disk at runtime — the
# annotated overlay (public/rally-debug) and the setup frames
# (public/setup-frames) — are both regenerable: re-run the analysis and they
# come back. They are served as static files out of public/, so moving them to
# a volume elsewhere would 404 unless a route served them too. The real fix is
# uploading them to R2, which src/lib/vision/debug-video-store.ts was written
# to make a one-file change; until then, a redeploy costs you the overlays of
# past runs and nothing else.

[[vm]]
  # MEASURED Sept 11 2026, and the reason this is 8x rather than 2x.
  #
  # detect_ball.py runs at ~40 frames/sec on Ky's M-series laptop and roughly
  # 1-3 frames/sec here. That is a 15-25x gap at nearly the SAME core count,
  # so it is not a core-count problem: ONNX Runtime finds CoreML on the laptop
  # and drives the Neural Engine, and there is no accelerator here at all.
  # CPU inference is what this box does, and CPU inference scales close to
  # linearly with cores.
  #
  # Fly prices cores linearly too -- 2x $0.0861/hr, 4x $0.1722, 8x $0.3444 --
  # which makes this upgrade very nearly FREE. Four times the cores finish in
  # roughly a quarter of the wall clock at four times the rate, so the cost
  # PER ANALYSIS is unchanged; only the waiting shrinks. That holds because
  # billing is per second and the idle watchdog stops the machine between
  # runs. It would not hold on a machine billed by the month and left running.
  #
  # Memory still matters for the original reason: torch, ffmpeg and a decoded
  # frame buffer are resident at once. 8x brings 16GB, which also gives the
  # ball stage headroom it did not have -- OOM during that stage is the prime
  # suspect for the run that sat at "Tracking the ball" for ten hours.
  size = "performance-8x"   # 8 vCPU / 16GB
